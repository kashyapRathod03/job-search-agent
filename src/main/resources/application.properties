# =======================================================
# LinkedIn Job Search & Application Agent Configuration
# =======================================================

# LinkedIn Authentication
linkedin.username=${LINKEDIN_USERNAME:kashyapdr044@gmail.com}
linkedin.password=${LINKEDIN_PASSWORD:}
linkedin.headless=false
linkedin.session.path=./.session/state.json

# Anti-Bot Delay Configuration (in milliseconds)
agent.delay.min-ms=2000
agent.delay.max-ms=6000

# Google Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Search Parameters
search.keywords=Java Developer, Spring Boot Developer, Java Backend Developer, Java Full Stack Developer
search.locations=Bangalore, Pune, Hyderabad, Gurgaon, India
search.easy-apply-only=true
search.date-posted=past-week
search.max-applications=10

# Applicant Fallback Contact (if absent from profile.md)
applicant.name=Kashyap Rathod
applicant.email=${APPLICANT_EMAIL:kashyapdr044@gmail.com}
applicant.phone=${APPLICANT_PHONE:+919054397202}
applicant.location=Anand, Gujarat, India

# Logging
logging.level.com.jobagent=INFO
logging.level.org.springframework=WARN
